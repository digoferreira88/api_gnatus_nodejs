            fichas: { type: array, items: { type: object, properties: { id: { type: integer }, fornecedor_id: { type: integer }, codigo: { type: string }, razao_social: { type: string }, formulario: { $ref: "#/components/schemas/Formulario" }, status: { type: string }, respondida_em: { type: string, nullable: true }, enviada_em: { type: string, nullable: true }, token_expira_em: { type: string, nullable: true } } } }
            auditorias: { type: array, items: { type: object, properties: { id: { type: integer }, fornecedor_id: { type: integer }, codigo: { type: string }, razao_social: { type: string }, tipo: { type: string }, motivo_tipo: { type: string }, data_agendada: { type: string, format: date, nullable: true } } } }
        dadosLegado: { type: object, properties: { datas_futuras: { type: integer }, sem_data: { type: integer }, com_aviso: { type: integer } } }

    FaixaP:
      type: object
      properties:
        ate: { type: integer, nullable: true, description: "dias (inclusive); null = sem limite (obrigatória)" }
        valor: { type: number }
        rotulo: { type: string }

    RegraConteudo:
      type: object
      description: "JSON de uma versão de regra (imutável depois de gravada)"
      required: [faixasC, faixasN, classes, janelaN, escopoN, questionario]
      properties:
        pontos: { type: object, properties: { SIM: { type: number }, PARCIAL: { type: number }, NAO: { type: number } } }
        questionario: { type: object, properties: { aprovado_min: { type: number, example: 70 }, restricao_min: { type: number, example: 50 } } }
        faixasC: { type: array, items: { type: object, properties: { min: { type: number }, valor: { type: number }, rotulo: { type: string } } } }
        prazo:
          type: object
          description: "OUT261 — três tabelas de P (use `prazo` OU `faixasP`)"
          properties:
            nacional: { type: array, items: { $ref: "#/components/schemas/FaixaP" }, description: "dias de atraso na ENTREGA" }
            importado: { type: array, items: { $ref: "#/components/schemas/FaixaP" }, description: "dias de atraso na COLETA" }
            antecipacao: { type: array, items: { $ref: "#/components/schemas/FaixaP" }, description: "dias de antecipação (nacional e importado)" }
        faixasP:
          type: array
          description: "regra antiga (planilha): dias = real − prevista numa tabela só"
          items: { $ref: "#/components/schemas/FaixaP" }
        faixasN: { type: array, items: { type: object, properties: { ncs: { type: integer }, valor: { type: number }, rotulo: { type: string } } } }
        janelaN: { type: integer, example: 3 }
        escopoN: { type: string, enum: [FORNECEDOR, FORNECEDOR_ITEM], example: FORNECEDOR_ITEM }
        classes:
          type: array
          items:
            type: object
            properties:
              classe: { type: string }
              min: { type: number, nullable: true, description: "null = classe final (abaixo)" }
              rotulo: { type: string }
              cor: { type: string }
              acao: { $ref: "#/components/schemas/AcaoClasse" }
        requalificacao: { type: object, properties: { meses: { type: integer, example: 12 }, antecedenciaDias: { type: integer, example: 30 } } }
        auditoriaAcompanhamento:
          type: object
          description: "gatilhos do PRO 5.6.2"
          properties:
            iqfLimite: { type: number, example: 7 }
            avaliacoesConsecutivas: { type: integer, example: 2 }
            ncsMinimo: { type: integer, example: 3 }
            ncsJanelaMeses: { type: integer, example: 6 }
        amostragem:
          type: object
          description: "NBR 5426: { norma, I: [{de, ate, amostra, ac, re}], II: [...] }"

    RegraVersao:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        referencia: { type: string, nullable: true }
        descricao: { type: string, nullable: true }
        conteudo: { $ref: "#/components/schemas/RegraConteudo" }
        ativa: { type: boolean }
        criado_em: { type: string, format: date-time }
        ativada_em: { type: string, format: date-time, nullable: true }
        criado_por_nome: { type: string, nullable: true }
        ativada_por_nome: { type: string, nullable: true }
        inspecoes: { type: integer }

    Ativacao:
      type: object
      properties:
        de: { type: string, nullable: true, description: "versão que estava ativa" }
        recalculo: { type: object, properties: { fornecedores: { type: integer }, classeAlterada: { type: integer } } }

    LogLinha:
      type: object
      properties:
        id: { type: integer }
        entidade: { type: string }
        entidade_id: { type: integer, nullable: true }
        fornecedor_id: { type: integer, nullable: true }
        fornecedor_codigo: { type: string, nullable: true }
        acao: { type: string }
        campo: { type: string, nullable: true }
        valor_anterior: { type: string, nullable: true }
        valor_novo: { type: string, nullable: true }
        motivo: { type: string, nullable: true }
        usuario_nome: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        criado_em: { type: string, format: date-time }
